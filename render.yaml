services:
  - type: web
    name: lionconnect-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_BACKEND_CALLBACK_URI
        value: https://lionconnect-backend.onrender.com/auth/callback/kakao
      - key: FRONTEND_REDIRECT_URI
        value: https://lion-connect.vercel.app/auth/kakao/callback
      - key: FRONTEND_DEV_REDIRECT_URI
        value: http://localhost:3000/auth/kakao/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false 