<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커넥트 요청 - LionConnect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .required {
            color: #e74c3c;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #333;
        }

        .student-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .student-info h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .student-info p {
            color: #666;
            margin-bottom: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="close-btn" onclick="closePopup()">&times;</button>
        
        <div class="header">
            <h1>🦁 커넥트 요청</h1>
            <p>수료생에게 연결 요청을 보내세요</p>
        </div>

        <div class="student-info" id="studentInfo">
            <h3>수료생 정보</h3>
            <p><strong>이름:</strong> <span id="studentName">로딩 중...</span></p>
            <p><strong>과정:</strong> <span id="studentCourse">로딩 중...</span></p>
            <p><strong>기술스택:</strong> <span id="studentTechStack">로딩 중...</span></p>
        </div>

        <div class="alert alert-success" id="successAlert">
            커넥트 요청이 성공적으로 전송되었습니다!
        </div>

        <div class="alert alert-error" id="errorAlert">
            커넥트 요청 전송 중 오류가 발생했습니다.
        </div>

        <form id="connectForm">
            <div class="form-group">
                <label for="representativeName">담당자 이름 <span class="required">*</span></label>
                <input type="text" id="representativeName" name="representativeName" required>
            </div>

            <div class="form-group">
                <label for="representativeEmail">담당자 이메일 <span class="required">*</span></label>
                <input type="email" id="representativeEmail" name="representativeEmail" required>
            </div>

            <div class="form-group">
                <label for="representativePhone">담당자 전화번호 <span class="required">*</span></label>
                <input type="tel" id="representativePhone" name="representativePhone" required>
            </div>

            <div class="form-group">
                <label for="companyName">기업명</label>
                <input type="text" id="companyName" name="companyName">
            </div>

            <div class="form-group">
                <label for="position">채용 포지션</label>
                <input type="text" id="position" name="position" placeholder="예: 프론트엔드 개발자">
            </div>

            <div class="form-group">
                <label for="jobDescription">직무 설명</label>
                <textarea id="jobDescription" name="jobDescription" placeholder="담당하게 될 업무에 대해 설명해주세요"></textarea>
            </div>

            <div class="form-group">
                <label for="requiredStack">필수 기술스택</label>
                <input type="text" id="requiredStack" name="requiredStack" placeholder="예: React, TypeScript, Node.js">
            </div>

            <div class="form-group">
                <label for="careerLevel">경력 수준</label>
                <select id="careerLevel" name="careerLevel">
                    <option value="">선택해주세요</option>
                    <option value="신입">신입</option>
                    <option value="1-3년">1-3년</option>
                    <option value="3-5년">3-5년</option>
                    <option value="5년 이상">5년 이상</option>
                </select>
            </div>

            <div class="form-group">
                <label for="employmentType">고용 형태</label>
                <select id="employmentType" name="employmentType">
                    <option value="">선택해주세요</option>
                    <option value="정규직">정규직</option>
                    <option value="계약직">계약직</option>
                    <option value="인턴">인턴</option>
                    <option value="프리랜서">프리랜서</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">메시지</label>
                <textarea id="message" name="message" placeholder="수료생에게 전달할 메시지를 작성해주세요"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                커넥트 요청 보내기
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>요청을 전송하고 있습니다...</p>
        </div>
    </div>

    <script>
        // URL 파라미터에서 학생 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const studentUserId = urlParams.get('student_user_id');
        const portfolioId = urlParams.get('portfolio_id');
        const studentName = urlParams.get('student_name');
        const studentCourse = urlParams.get('student_course');
        const studentTechStack = urlParams.get('student_tech_stack');

        // 학생 정보 표시
        if (studentName) document.getElementById('studentName').textContent = studentName;
        if (studentCourse) document.getElementById('studentCourse').textContent = studentCourse;
        if (studentTechStack) document.getElementById('studentTechStack').textContent = studentTechStack;

        // 폼 제출 처리
        document.getElementById('connectForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const successAlert = document.getElementById('successAlert');
            const errorAlert = document.getElementById('errorAlert');
            
            // 로딩 상태 표시
            submitBtn.disabled = true;
            loading.classList.add('show');
            successAlert.style.display = 'none';
            errorAlert.style.display = 'none';
            
            try {
                const formData = new FormData(e.target);
                const requestData = {
                    company_user_id: 0, // 임시값 (실제로는 로그인된 사용자 ID 사용)
                    student_user_id: parseInt(studentUserId),
                    portfolio_id: parseInt(portfolioId),
                    company_representative_name: formData.get('representativeName'),
                    company_representative_email: formData.get('representativeEmail'),
                    company_representative_phone: formData.get('representativePhone'),
                    company_name: formData.get('companyName') || null,
                    position: formData.get('position') || null,
                    job_description: formData.get('jobDescription') || null,
                    required_stack: formData.get('requiredStack') || null,
                    career_level: formData.get('careerLevel') || null,
                    employment_type: formData.get('employmentType') || null,
                    message: formData.get('message') || null
                };
                
                const response = await fetch('/connect/request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    successAlert.style.display = 'block';
                    e.target.reset();
                    
                    // 3초 후 팝업 닫기
                    setTimeout(() => {
                        closePopup();
                    }, 3000);
                } else {
                    const errorData = await response.json();
                    errorAlert.textContent = errorData.detail || '커넥트 요청 전송 중 오류가 발생했습니다.';
                    errorAlert.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorAlert.textContent = '네트워크 오류가 발생했습니다.';
                errorAlert.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('show');
            }
        });

        // 팝업 닫기
        function closePopup() {
            if (window.opener) {
                window.close();
            } else {
                window.history.back();
            }
        }

        // 전화번호 입력 시 자동 포맷팅
        document.getElementById('representativePhone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 3) {
                value = value;
            } else if (value.length <= 7) {
                value = value.slice(0, 3) + '-' + value.slice(3);
            } else {
                value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
